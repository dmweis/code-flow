[package]
name = "code-flow"
version = "0.1.0"
authors = ["David Weis <dweis7@gmail.com>"]
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for your open GitHub pull requests, with their review, CI, and merge status at a glance"
repository = "https://github.com/dmweis/code-flow"
readme = "README.md"
keywords = ["github", "pull-request", "tui", "git", "worktree"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT OR Apache-2.0"
default-run = "code-flow"

[[bin]]
name = "code-flow"
path = "src/main.rs"

[[bin]]
name = "cf"
path = "src/bin/cf.rs"

[dependencies]
anyhow = "1.0.104"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
